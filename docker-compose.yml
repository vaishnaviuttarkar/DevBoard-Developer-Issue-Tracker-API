services:
  web:
    build: .
    ports: 
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: devboard
      POSTGRES_USER: devboard
      POSTGRES_PASSWORD: devboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: